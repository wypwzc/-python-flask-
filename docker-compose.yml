# 博客系统 Docker 部署（MySQL + Flask 应用 + Nginx）
# 使用前：在服务器上创建 .env（见 DEPLOY.md），并把 nginx/nginx.conf 中的域名/证书路径替换成你的
version: "3.8"

services:
  # ── MySQL 8 ──
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql   # 数据持久化，容器重建不丢数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Flask 应用（5000 前台 + 5888 后台）──
  app:
    build: .
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      # 容器网络内通过 mysql 主机名访问数据库
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/blog_db
      # 邮件通知（可选，不配置则发信失败被静默忽略，不影响使用）
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      # 是否创建示例文章（首次部署保持 true）
      CREATE_SAMPLE_DATA: ${CREATE_SAMPLE_DATA:-true}
    expose:
      - "5000"
      - "5888"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/posts', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Nginx 反向代理（80/443 前台 + 5888 后台）──
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "5888:5888"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录（阿里云 SSL 证书，已放服务器 /root/ssl/ 下）
      - /root/ssl:/root/ssl:ro
    depends_on:
      - app

volumes:
  mysql_data:
