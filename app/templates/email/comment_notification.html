<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #0d6efd; color: white; padding: 20px; border-radius: 8px 8px 0 0; }
        .content { background: #f8f9fa; padding: 20px; border: 1px solid #dee2e6; }
        .footer { background: #f8f9fa; padding: 15px; text-align: center; font-size: 12px; color: #6c757d; border: 1px solid #dee2e6; border-radius: 0 0 8px 8px; }
        .comment-box { background: white; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .btn { display: inline-block; padding: 10px 20px; background: #0d6efd; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📝 新评论通知</h2>
        </div>
        <div class="content">
            <p><strong>{{ comment.author_name }}</strong> 在文章 <strong>《{{ post_title }}》</strong> 中发表了新的评论：</p>

            <div class="comment-box">
                <p>{{ comment.content }}</p>
                <small>时间：{{ comment.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
                <br>
                <small>IP：{{ comment.ip_address or '未知' }}</small>
            </div>

            <p>
                <a href="{{ url_for('admin.comment_list', _external=True) }}" class="btn">前往后台管理</a>
            </p>
        </div>
        <div class="footer">
            <p>此邮件由博客系统自动发送，请勿回复</p>
        </div>
    </div>
</body>
</html>
