# 博客系统 Nginx 配置（Docker 版）
# 说明：
#   - 80 端口：HTTP 一律 301 跳转到 HTTPS（前台）
#   - 443 端口：博客前台（https://你的域名）
#   - 5888 端口：博客后台（https://你的域名:5888，同一张证书）
# 使用前请把 wzcwyp.xyz 替换成你的域名，并确认证书路径存在。
# 注意：请同时把 cert.pem / privkey.pem 挂载进 nginx 容器（docker-compose.yml 中 volumes）。

# ── HTTP → HTTPS 跳转（裸域和 www 都跳转到 www）──
server {
    listen 80;
    server_name wzcwyp.xyz www.wzcwyp.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://www.wzcwyp.xyz$request_uri;
}

# ── 前台 HTTPS（443，证书只覆盖 www 子域）──
server {
    listen 443 ssl;
    http2 on;
    server_name www.wzcwyp.xyz;

    ssl_certificate     /root/ssl/www.wzcwyp.xyz.pem;
    ssl_certificate_key /root/ssl/www.wzcwyp.xyz.key;

    # 上传封面/头像最大 5MB（后端限制），放宽一点给 Nginx 层
    client_max_body_size 10m;

    # 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    # 前端构建产物带 hash 文件名，可强缓存一年
    location /assets/ {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余（页面 + /api）全部反代到 Flask（Flask 自带 SPA history fallback）
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── 后台 HTTPS（5888，同一张证书）──
server {
    listen 5888 ssl;
    http2 on;
    server_name www.wzcwyp.xyz;

    ssl_certificate     /root/ssl/www.wzcwyp.xyz.pem;
    ssl_certificate_key /root/ssl/www.wzcwyp.xyz.key;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    location / {
        proxy_pass http://app:5888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
